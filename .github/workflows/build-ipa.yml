
name: Build FLYRA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flyra-app
        run: npm ci

      - name: Generate iOS project
        working-directory: flyra-app
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: flyra-app
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        working-directory: flyra-app
        run: |
          set +e

          xcodebuild \
            -workspace ios/flyraapp.xcworkspace \
            -scheme flyraapp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcode-build.log 2>&1

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "===== XCODE BUILD ERRORS ====="
            grep -n -i -B 3 -A 5 -E 'error:|fatal error:|BUILD FAILED' xcode-build.log | tail -n 160 || tail -n 100 xcode-build.log
            exit "$STATUS"
          fi

          echo "===== BUILD SUCCEEDED ====="
          tail -n 40 xcode-build.log

      - name: Package unsigned IPA
        working-directory: flyra-app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/flyraapp.app Payload/
          zip -r FLYRA-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FLYRA-unsigned-IPA
          path: flyra-app/FLYRA-unsigned.ipa
          retention-days: 7
