name: Build FLYRA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flyra-app
        run: npm ci

      - name: Generate iOS project
        working-directory: flyra-app
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: flyra-app
        run: pod install --project-directory=ios

      - name: Build unsigned iOS app
        working-directory: flyra-app
        run: |
          xcodebuild \
            -workspace ios/flyraapp.xcworkspace \
            -scheme flyraapp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: flyra-app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/flyraapp.app Payload/
          zip -r FLYRA-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FLYRA-unsigned-IPA
          path: flyra-app/FLYRA-unsigned.ipa
          retention-days: 7
